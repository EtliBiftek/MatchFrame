[package]
name = "matchframe-core"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# analysis-rs: Rust analiz motoru (Aşama 8). Varsayılan olarak DERLENMEZ.
# Etkinleştirmek için: cargo build --release --features analysis-rs
[features]
analysis-rs = []

[build-dependencies]
cc = "1"
